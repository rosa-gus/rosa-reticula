<header class="masthead">
  <a class="header-identity" href="./" aria-label="" data-i18n-aria-label="workbench.home">
    <img class="brand-mark" data-brand-image width="32" height="32" alt="">
    <span class="brand-copy">
      <span class="wordmark">Rosa Retícula</span>
      <span class="brand-detail">
        <span class="brand-label">workbench</span>
        <span class="metadata-separator" aria-hidden="true"></span>
        <span class="brand-version"></span>
      </span>
    </span>
  </a>
  <div class="header-actions">
    <div class="language-control">
      <label for="language" class="sr-only">
        <span data-i18n="common.language"></span>
      </label>
      <select id="language" aria-label="" data-i18n-aria-label="common.language"></select>
    </div>
    <span class="local-note meta">
      <span data-i18n="workbench.local"></span>
    </span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="">
      <span data-i18n="workbench.light"></span>
    </button>
  </div>
</header>
<main>
  <h1 class="sr-only">
    <span data-i18n="workbench.title"></span>
  </h1>
  <p class="workbench-description">
    <span data-i18n="workbench.description"></span>
  </p>
  <section class="workbench" aria-label="" data-i18n-aria-label="workbench.editor">
    <div class="source-heading">
      <div class="source-name">
        <span id="filename">
          <span data-i18n="workbench.loadingSample"></span>
        </span>
        <span class="meta metadata" id="file-detail"></span>
      </div>
      <button id="select-image" title="" data-i18n-title="workbench.openTitle">
        <span data-i18n="workbench.open"></span>
      </button>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
    <div class="preview-panel">
      <div class="preview-toolbar">
        <div class="segmented view-control" role="group" aria-label="" data-i18n-aria-label="workbench.view">
          <button data-view="result" aria-pressed="true">
            <span data-i18n="workbench.treated"></span>
          </button>
          <button data-view="original" aria-pressed="false">
            <span data-i18n="workbench.original"></span>
          </button>
          <button data-view="split" aria-pressed="false">
            <span data-i18n="workbench.compare"></span>
          </button>
        </div>
      </div>
      <div id="drop-zone" class="preview-stage" aria-label="" data-i18n-aria-label="workbench.dropLabel">
        <div id="canvas-wrap" class="canvas-wrap">
          <canvas id="result-canvas" aria-label="" data-i18n-aria-label="workbench.treatedImage"></canvas>
          <div id="original-layer" class="original-layer">
            <canvas id="original-canvas" aria-label="" data-i18n-aria-label="workbench.originalImage"></canvas>
          </div>
          <div
            id="split-line"
            class="split-line"
            role="slider"
            tabindex="0"
            aria-label=""
            data-i18n-aria-label="workbench.split"
            aria-orientation="horizontal"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
            title=""
            data-i18n-title="workbench.splitHelp"
            hidden
          >
            <span aria-hidden="true">&lt;|&gt;</span>
          </div>
        </div>
        <div class="drop-overlay">
          <span>
            <span data-i18n="workbench.drop"></span>
          </span>
          <span class="meta">PNG / JPEG / WebP</span>
        </div>
      </div>
      <div class="preview-footer">
        <span class="meta metadata" id="dimensions">
          <span data-i18n="workbench.loadingSample"></span>
        </span>
        <div class="segmented zoom-control" role="group" aria-label="Zoom">
          <button id="fit" aria-pressed="true">
            <span data-i18n="workbench.fit"></span>
          </button>
          <button id="actual" aria-pressed="false">[1:1]</button>
        </div>
      </div>
      <div class="source-bar">
        <span class="meta">
          <span data-i18n="workbench.examples"></span>
        </span>
        <div id="example-list" class="example-list" role="group" aria-label="" data-i18n-aria-label="workbench.exampleImages"></div>
      </div>
    </div>
    <aside class="settings" aria-label="" data-i18n-aria-label="workbench.settings">
      <div class="settings-content">
        <section class="setting-section profile-section">
          <div class="profile-heading">
            <label for="profile">
              <span data-i18n="workbench.profile"></span>
            </label>
            <button
              id="modified"
              class="meta is-modified"
              type="button"
              aria-label=""
              data-i18n-aria-label="workbench.restoreProfile"
              title=""
              data-i18n-title="workbench.restoreProfile"
              hidden
            >
              <span data-i18n="workbench.modified"></span>
            </button>
          </div>
          <select id="profile" aria-describedby="profile-description"></select>
          <p id="profile-description" class="field-note metadata">
            Bayer 4×4
            <span class="metadata-separator" aria-hidden="true"></span>
            <span data-i18n="workbench.pairsGrid"></span>
            <br>
            <span data-i18n="workbench.nineLevels"></span>
          </p>
        </section>
        <section class="setting-section">
          <h2 class="section-label">
            <span data-i18n="workbench.tone"></span>
          </h2>
          <div class="sliders" id="tone-controls"></div>
        </section>
        <section class="setting-section">
          <div class="section-heading">
            <div class="section-title">
              <h2 class="section-label">
                <span data-i18n="workbench.duotone"></span>
              </h2>
              <span data-help="duotone"></span>
            </div>
            <button id="swap-colors" class="text-button">
              <span data-i18n="workbench.swap"></span>
            </button>
          </div>
          <div
            class="colors"
            role="group"
            aria-label=""
            data-i18n-aria-label="workbench.duotone"
            aria-describedby="duotone-help"
          >
            <label class="color-control">
              <input
                id="shadow"
                data-param="shadow"
                type="color"
                aria-label=""
                data-i18n-aria-label="workbench.shadowColor"
              >
              <span>
                <span data-i18n="workbench.shadow"></span>
                <output id="shadow-value"></output>
              </span>
            </label>
            <label class="color-control">
              <input
                id="highlight"
                data-param="highlight"
                type="color"
                aria-label=""
                data-i18n-aria-label="workbench.highlightColor"
              >
              <span>
                <span data-i18n="workbench.highlight"></span>
                <output id="highlight-value"></output>
              </span>
            </label>
          </div>
        </section>
        <details class="setting-section advanced">
          <summary>
            <span class="disclosure-mark" aria-hidden="true"></span>
            <span data-i18n="workbench.advanced"></span>
          </summary>
          <div class="advanced-content">
            <div id="blur-control"></div>
            <div class="stacked">
              <label for="curve">
                <span data-i18n="workbench.curve"></span>
              </label>
              <select id="curve">
                <option value="original" data-i18n="workbench.rosaOriginal"></option>
                <option value="linear" data-i18n="workbench.linear"></option>
                <option value="custom" disabled data-i18n="workbench.customCurve"></option>
              </select>
            </div>
            <label class="stacked" for="palette">
              <span data-i18n="workbench.levels"></span>
              <input id="palette" type="text" spellcheck="false" aria-describedby="palette-help">
            </label>
            <p class="field-note" id="palette-help">
              <span data-i18n="workbench.levelsHelp"></span>
            </p>
            <label class="stacked" for="shadows">
              <span data-i18n="workbench.shadows"></span>
              <input id="shadows" type="text" spellcheck="false">
            </label>
            <label class="stacked" for="signature">
              <span data-i18n="workbench.signature"></span>
              <input id="signature" type="text" spellcheck="false">
            </label>
            <p class="field-note">
              <span data-i18n="workbench.rangeHelp"></span>
            </p>
            <label class="background-control" for="background">
              <span data-i18n="workbench.background"></span>
              <input id="background" data-param="background" type="color">
            </label>
          </div>
        </details>
        <details class="setting-section recipes">
          <summary>
            <span class="disclosure-mark" aria-hidden="true"></span>
            <span data-i18n="workbench.recipes"></span>
          </summary>
          <div class="advanced-content">
            <label class="stacked" for="profile-name">
              <span data-i18n="workbench.saveAs"></span>
              <input
                id="profile-name"
                type="text"
                maxlength="60"
                placeholder=""
                data-i18n-placeholder="workbench.profilePlaceholder"
              >
            </label>
            <button id="save-profile">
              <span data-i18n="workbench.save"></span>
            </button>
            <div class="recipe-actions">
              <button id="import-recipe">
                <span data-i18n="workbench.import"></span>
              </button>
              <button id="export-recipe">
                <span data-i18n="workbench.exportRecipe"></span>
              </button>
            </div>
            <input id="recipe-file" type="file" accept=".json,application/json" hidden>
            <p class="field-note">
              <span data-i18n="workbench.recipeHelp"></span>
            </p>
          </div>
        </details>
      </div>
      <div class="export-area">
        <button id="reset" class="text-button">
          <span data-i18n="workbench.reset"></span>
        </button>
        <section class="output-settings" aria-labelledby="output-title">
          <h2 id="output-title" class="section-label">
            <span data-i18n="workbench.output"></span>
          </h2>
          <div class="output-format">
            <label for="export-format">
              <span data-i18n="workbench.format"></span>
            </label>
            <select id="export-format">
              <option value="png">PNG</option>
              <option value="webp" data-i18n="workbench.webpLossless"></option>
            </select>
          </div>
          <div class="output-width">
            <label for="width">
              <span data-i18n="workbench.width"></span>
            </label>
            <span class="input-unit">
              <input
                id="width"
                type="number"
                min="1"
                max="4096"
                step="1"
                value="1200"
                aria-describedby="width-help"
              >
              <span>px</span>
            </span>
          </div>
          <p id="width-help" class="field-note">
            <span data-i18n="workbench.sizeHelp"></span>
            <br>
            <span data-i18n="workbench.resizeHelp"></span>
          </p>
        </section>
        <button id="export-image" class="primary" disabled>
          [<span id="export-label"></span>
          <span class="icon-arrow export-arrow" aria-hidden="true">&#x2197;&#xFE0E;</span>]
        </button>
        <span id="export-details" class="export-note meta">
          PNG
          <span class="metadata-separator" aria-hidden="true"></span>
          <span data-i18n="workbench.opaque"></span>
        </span>
      </div>
    </aside>
  </section>
  <div class="processing-footer">
    <div id="status" class="status meta" role="status" aria-live="polite">
      <span data-i18n="workbench.initializing"></span>
    </div>
  </div>
  <footer class="page-footer">
    <div class="footer-identity">
      <span class="footer-wordmark">Rosa Retícula</span>
      <span class="footer-byline meta">
        <span data-i18n="workbench.by"></span>
        <a
          class="author-link"
          href="https://rosa-gus.github.io/portfolio"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="author-accent">rosa</span>-gus
        </a>
      </span>
    </div>
    <nav class="footer-links" aria-label="" data-i18n-aria-label="workbench.resources">
      <a href="https://github.com/rosa-gus/rosa-reticula" target="_blank" rel="noopener noreferrer">
        [<span data-i18n="workbench.repository"></span>
        <span class="icon-arrow" aria-hidden="true">&#x2197;&#xFE0E;</span>]
      </a>
      <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">
        [<span data-i18n="workbench.license"></span>
        <span data-license></span>
        <span class="icon-arrow" aria-hidden="true">&#x2197;&#xFE0E;</span>]
      </a>
    </nav>
  </footer>
</main>
<template id="range-control-template">
  <div class="control">
    <div class="control-heading">
      <div class="control-title">
        <label data-control-label></label>
        <span data-control-help></span>
      </div>
      <output></output>
    </div>
    <input type="range">
  </div>
</template>

<template id="help-template">
  <span class="help">
    <button type="button" class="tooltip-trigger" aria-expanded="false">[?]</button>
    <span class="app-tooltip" popover="auto" role="tooltip">
      <span class="tooltip-content">
        <span class="tooltip-title" data-help-title></span>
        <span data-help-explanation></span>
      </span>
    </span>
  </span>
</template>
