<div class="workspace-shell">
<header class="masthead">
  <div class="header-identity">
    <img class="brand-mark" data-brand-image width="32" height="32" alt="">
    <span class="brand-copy">
      <span class="wordmark">Rosa Retícula</span>
      <span class="brand-detail">
        <span class="brand-label">workbench</span>
        <span class="metadata-separator" aria-hidden="true"></span>
        <span class="brand-version"></span>
      </span>
    </span>
  </div>
  <button id="header-menu" class="header-menu" type="button" aria-controls="header-actions" aria-expanded="false" data-i18n="workbench.menu"></button>
  <div id="header-actions" class="header-actions">
    <div class="language-control">
      <label for="language" class="sr-only">
        <span data-i18n="common.language"></span>
      </label>
      <select id="language" aria-label="" data-i18n-aria-label="common.language"></select>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="">
      [<span data-i18n="theme.dark"></span>]
    </button>
    <details class="about-menu">
      <summary data-i18n="workbench.about"></summary>
      <div class="about-content">
        <p class="workbench-description" data-i18n="workbench.description"></p>
        <p class="meta" data-i18n="workbench.local"></p>
      </div>
    </details>
  </div>
</header>
<main>
  <h1 class="sr-only">
    <span data-i18n="workbench.title"></span>
  </h1>
  <div class="editor-content">
    <div class="source-heading">
      <div class="source-actions">
        <button id="select-image" class="source-command" type="button" data-i18n-title="workbench.openTitle">
          <span data-i18n="workbench.open"></span>
        </button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <div class="example-picker">
          <select id="examples" hidden></select>
        </div>
      </div>
      <div class="source-name">
        <span id="filename"><span data-i18n="workbench.loadingSample"></span></span>
        <span class="meta metadata" id="file-detail"></span>
      </div>
      <div class="segmented media-tabs view-control" role="tablist" data-i18n-aria-label="video.mode">
        <button id="mode-image" type="button" role="tab" aria-selected="true" aria-controls="editor-panel" data-mode="image" tabindex="0">[<span data-i18n="video.image"></span>]</button>
        <button id="mode-video" type="button" role="tab" aria-selected="false" aria-controls="editor-panel" data-mode="video" tabindex="-1">[<span data-i18n="video.video"></span>]</button>
      </div>
    </div>
    <section id="editor-panel" role="tabpanel" aria-labelledby="mode-image" class="workbench">
      <section class="preview-panel" aria-labelledby="preview-title">
        <h2 id="preview-title" class="sr-only" data-i18n="workbench.preview"></h2>
        <div class="preview-toolbar">
          <div class="segmented view-control" role="group" aria-label="" data-i18n-aria-label="workbench.view">
            <button data-view="result" aria-pressed="true">
              [<span data-i18n="workbench.treated"></span>]
            </button>
            <button data-view="original" aria-pressed="false">
              [<span data-i18n="workbench.original"></span>]
            </button>
            <button data-view="split" aria-pressed="false">
              [<span data-i18n="workbench.compare"></span>]
            </button>
          </div>
        </div>
        <div id="drop-zone" class="preview-stage" aria-label="" data-i18n-aria-label="workbench.dropLabel">
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="result-canvas" aria-label="" data-i18n-aria-label="workbench.treatedImage"></canvas>
            <div id="light-overlay" class="light-overlay" hidden>
              <div id="light-ring" class="light-ring"></div>
              <button id="light-position" class="light-handle" data-i18n-aria-label="video.position" aria-describedby="light-help" type="button">[+]</button>
              <button id="light-radius" class="light-handle radius-handle" data-i18n-aria-label="video.radiusHandle" type="button">[&lt;&gt;]</button>
            </div>
            <div id="original-layer" class="original-layer">
              <canvas id="original-canvas" aria-label="" data-i18n-aria-label="workbench.originalImage"></canvas>
            </div>
            <div class="split-labels" aria-hidden="true">
              <span data-i18n="workbench.original"></span>
              <span data-i18n="workbench.treated"></span>
            </div>
            <div
              id="split-line"
              class="split-line"
              role="slider"
              tabindex="0"
              aria-label=""
              data-i18n-aria-label="workbench.split"
              aria-orientation="horizontal"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="50"
              title=""
              data-i18n-title="workbench.splitHelp"
              hidden
            >
              <span aria-hidden="true">&lt;|&gt;</span>
            </div>
          </div>
          <div class="drop-overlay">
            <span>
              <span data-i18n="workbench.drop"></span>
            </span>
            <span class="meta">PNG / JPEG / WebP</span>
          </div>
        </div>
        <div id="playback" class="playback" hidden>
          <button id="pulse-play" type="button" data-i18n="video.play"></button>
          <button id="pulse-restart" type="button" data-i18n="video.restart"></button>
          <input id="pulse-timeline" type="range" min="0" max="1" step="0.001" value="0" data-i18n-aria-label="video.timeline">
          <output id="pulse-time" for="pulse-timeline" class="meta"></output>
        </div>
        <div class="preview-footer">
          <span class="meta metadata" id="dimensions">
            <span data-i18n="workbench.loadingSample"></span>
          </span>
          <div class="segmented zoom-control" role="group" aria-label="Zoom">
            <button id="fit" aria-pressed="true">
              <span data-i18n="workbench.fit"></span>
            </button>
            <button id="actual" aria-pressed="false">[1:1]</button>
          </div>
        </div>
      </section>
      <aside class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title" class="sr-only" data-i18n="workbench.settings"></h2>
        <div class="segmented settings-tabs" role="tablist" aria-labelledby="settings-title">
          <button id="tab-treatment" type="button" role="tab" aria-selected="true" aria-controls="treatment-settings">[<span data-i18n="workbench.treatment"></span>]</button>
          <button id="tab-pulse" type="button" role="tab" aria-selected="false" aria-controls="pulse-controls" tabindex="-1" hidden>[<span data-i18n="video.effect"></span>]</button>
          <button id="tab-output" type="button" role="tab" aria-selected="false" aria-controls="output-settings" tabindex="-1">[<span data-i18n="workbench.output"></span>]</button>
        </div>
        <div class="settings-content">
          <div id="treatment-settings" role="tabpanel" aria-labelledby="tab-treatment">
            <section class="setting-section profile-section">
              <div class="profile-heading">
                <label for="profile">
                  <span data-i18n="workbench.profile"></span>
                </label>
                <button
                  id="modified"
                  class="meta is-modified"
                  type="button"
                  aria-label=""
                  data-i18n-aria-label="workbench.restoreProfile"
                  title=""
                  data-i18n-title="workbench.restoreProfile"
                  hidden
                >
                  <span data-i18n="workbench.modified"></span>
                </button>
              </div>
              <select id="profile" aria-describedby="profile-description"></select>
              <p id="profile-description" class="field-note metadata">
                Bayer 4×4
                <span class="metadata-separator" aria-hidden="true"></span>
                <span data-i18n="workbench.pairsGrid"></span>
                <br>
                <span data-i18n="workbench.nineLevels"></span>
              </p>
            </section>
            <section class="setting-section">
              <h2 class="section-label">
                <span data-i18n="workbench.tone"></span>
              </h2>
              <div class="sliders" id="tone-controls"></div>
            </section>
            <section class="setting-section">
              <div class="section-heading">
                <div class="section-title">
                  <h2 class="section-label">
                    <span data-i18n="workbench.duotone"></span>
                  </h2>
                  <span data-help="duotone"></span>
                </div>
                <button id="swap-colors" class="text-button">
                  <span data-i18n="workbench.swap"></span>
                </button>
              </div>
              <div
                class="colors"
                role="group"
                aria-label=""
                data-i18n-aria-label="workbench.duotone"
                aria-describedby="duotone-help"
              >
                <label class="color-control">
                  <input
                    id="shadow"
                    data-param="shadow"
                    type="color"
                    aria-label=""
                    data-i18n-aria-label="workbench.shadowColor"
                  >
                  <span>
                    <span data-i18n="workbench.shadow"></span>
                    <output id="shadow-value"></output>
                  </span>
                </label>
                <label class="color-control">
                  <input
                    id="highlight"
                    data-param="highlight"
                    type="color"
                    aria-label=""
                    data-i18n-aria-label="workbench.highlightColor"
                  >
                  <span>
                    <span data-i18n="workbench.highlight"></span>
                    <output id="highlight-value"></output>
                  </span>
                </label>
              </div>
            </section>
            <details class="setting-section advanced">
              <summary>
                <span class="disclosure-mark" aria-hidden="true"></span>
                <span data-i18n="workbench.advanced"></span>
              </summary>
              <div class="advanced-content">
                <div id="blur-control"></div>
                <div class="stacked">
                  <label for="curve">
                    <span data-i18n="workbench.curve"></span>
                  </label>
                  <select id="curve">
                    <option value="original" data-i18n="workbench.rosaOriginal"></option>
                    <option value="linear" data-i18n="workbench.linear"></option>
                    <option value="custom" disabled data-i18n="workbench.customCurve"></option>
                  </select>
                </div>
                <label class="stacked" for="palette">
                  <span data-i18n="workbench.levels"></span>
                  <input id="palette" type="text" spellcheck="false" aria-describedby="palette-help">
                </label>
                <p class="field-note" id="palette-help">
                  <span data-i18n="workbench.levelsHelp"></span>
                </p>
                <label class="stacked" for="shadows">
                  <span data-i18n="workbench.shadows"></span>
                  <input id="shadows" type="text" spellcheck="false">
                </label>
                <label class="stacked" for="signature">
                  <span data-i18n="workbench.signature"></span>
                  <input id="signature" type="text" spellcheck="false">
                </label>
                <p class="field-note">
                  <span data-i18n="workbench.rangeHelp"></span>
                </p>
                <label class="background-control" for="background">
                  <span data-i18n="workbench.background"></span>
                  <input id="background" data-param="background" type="color">
                </label>
              </div>
            </details>
            <details class="setting-section recipes">
              <summary>
                <span class="disclosure-mark" aria-hidden="true"></span>
                <span data-i18n="workbench.recipes"></span>
              </summary>
              <div class="advanced-content">
                <label class="stacked" for="profile-name">
                  <span data-i18n="workbench.saveAs"></span>
                  <input
                    id="profile-name"
                    type="text"
                    maxlength="60"
                    placeholder=""
                    data-i18n-placeholder="workbench.profilePlaceholder"
                  >
                </label>
                <button id="save-profile">
                  <span data-i18n="workbench.save"></span>
                </button>
                <div class="recipe-actions">
                  <button id="import-recipe">
                    <span data-i18n="workbench.import"></span>
                  </button>
                  <button id="export-recipe">
                    <span data-i18n="workbench.exportRecipe"></span>
                  </button>
                </div>
                <input id="recipe-file" type="file" accept=".json,application/json" hidden>
                <p class="field-note">
                  <span data-i18n="workbench.recipeHelp"></span>
                </p>
                <p id="animation-recipe-note" class="field-note" data-i18n="video.recipeNote" hidden></p>
              </div>
            </details>
            <button id="reset" class="text-button">
              <span data-i18n="workbench.reset"></span>
            </button>
          </div>
          <section id="pulse-controls" role="tabpanel" aria-labelledby="tab-pulse" hidden>
            <div class="stacked">
              <label for="pulse-model" data-i18n="video.model"></label>
              <select id="pulse-model">
                <option value="organic" selected data-i18n="video.organic"></option>
                <option value="point" data-i18n="video.point"></option>
              </select>
            </div>
            <p class="field-note" data-light-model="organic" data-i18n="video.organicHelp"></p>
            <div class="sliders" id="pulse-sliders"></div>
            <div class="stacked pulse-curve">
              <label for="pulse-curve" data-i18n="video.curve"></label>
              <select id="pulse-curve">
                <option value="breath" data-i18n="video.breath"></option>
                <option value="beat" data-i18n="video.beat"></option>
                <option value="triangle" data-i18n="video.triangle"></option>
              </select>
            </div>
            <details class="pulse-advanced" data-light-model="organic">
              <summary><span class="disclosure-mark" aria-hidden="true"></span><span data-i18n="video.movement"></span></summary>
              <div class="advanced-content sliders" id="pulse-movement-controls"></div>
            </details>
            <details class="pulse-advanced">
              <summary><span class="disclosure-mark" aria-hidden="true"></span><span data-i18n="video.advanced"></span></summary>
              <div class="advanced-content">
                <div id="pulse-minimum-control"></div>
                <div id="pulse-point-controls" class="sliders" data-light-model="point" hidden></div>
                <div class="stacked">
                  <label for="pulse-polarity" data-i18n="video.polarity"></label>
                  <select id="pulse-polarity">
                    <option value="light" data-i18n="video.light"></option>
                    <option value="dark" data-i18n="video.dark"></option>
                  </select>
                </div>
                <div class="stacked" data-light-model="organic">
                  <label for="pulse-seed" data-i18n="video.seed"></label>
                  <input id="pulse-seed" type="number" min="0" max="4294967295" step="1" value="1" aria-describedby="seed-help">
                  <button id="pulse-randomize" class="text-button" type="button" data-i18n="video.randomize"></button>
                  <p id="seed-help" class="field-note" data-i18n="video.seedHelp"></p>
                </div>
                <div class="light-coordinates" data-light-model="point" hidden>
                  <label class="stacked">X (%)<input id="pulse-x" type="number" min="0" max="100" step="1" value="50"></label>
                  <label class="stacked">Y (%)<input id="pulse-y" type="number" min="0" max="100" step="1" value="50"></label>
                </div>
                <button id="pulse-center" data-light-model="point" hidden class="text-button" type="button" data-i18n="video.center"></button>
              </div>
            </details>
            <p id="light-help" data-light-model="point" hidden class="field-note" data-i18n="video.positionHelp"></p>
          </section>
          <section id="output-settings" class="output-settings" role="tabpanel" aria-labelledby="tab-output" hidden>
            <div id="image-format-row" class="output-format">
              <label for="export-format">
                <span data-i18n="workbench.format"></span>
              </label>
              <select id="export-format">
                <option value="png">PNG</option>
                <option value="webp" data-i18n="workbench.webpLossless"></option>
              </select>
              <p class="field-note output-format-note">
                <span data-i18n="workbench.lossless"></span> /
                <span data-i18n="workbench.opaque"></span>
              </p>
            </div>
            <div id="video-output" hidden>
              <div class="output-format">
                <label for="video-format" data-i18n="workbench.format"></label>
                <select id="video-format"><option value="gif">GIF</option><option value="mp4">MP4</option></select>
              </div>
              <div id="mp4-quality" class="output-format" hidden>
                <span data-i18n="video.quality"></span>
                <span data-i18n="video.preserveDetails"></span>
              </div>
              <div class="output-format">
                <label for="pulse-cycles" data-i18n="video.cycles"></label>
                <input id="pulse-cycles" type="number" min="1" max="6" step="1" value="2">
              </div>
              <div class="output-format">
                <label for="pulse-fps" data-i18n="video.fps"></label>
                <select id="pulse-fps"><option value="12">12</option><option value="24" selected>24</option><option value="30">30</option></select>
              </div>
              <p class="field-note">
                <span id="pulse-duration"></span> /
                <span data-i18n="video.loop"></span>
              </p>
              <p id="mp4-note" class="field-note" data-i18n="video.mp4Note" hidden></p>
            </div>
            <div class="output-width">
              <label for="width">
                <span data-i18n="workbench.width"></span>
              </label>
              <span class="input-unit">
                <input
                  id="width"
                  type="number"
                  min="1"
                  max="4096"
                  step="1"
                  value="1200"
                  aria-describedby="width-help"
                >
                <span>px</span>
              </span>
            </div>
            <p id="width-help" class="field-note">
              <span data-i18n="workbench.sizeHelp"></span>
              <br>
              <span data-i18n="workbench.resizeHelp"></span>
            </p>
          </section>
        </div>
      </aside>
    </section>
  </div>
  <div class="export-area">
    <div class="export-summary">
      <span id="export-details" class="export-note meta">PNG</span>
      <div id="status" class="status meta" role="status">
        <span data-i18n="workbench.initializing"></span>
      </div>
      <span id="video-progress" class="meta" role="status" hidden></span>
    </div>
    <div class="export-actions">
      <button id="export-image" class="primary" type="button" disabled>
        [<span id="export-label"></span>]
      </button>
      <button id="cancel-video-export" class="text-button" type="button" data-i18n="video.cancel" hidden></button>
    </div>
  </div>
</main>
</div>
<footer class="page-footer">
  <div class="footer-identity">
    <span class="footer-glyph" aria-hidden="true">
      <span>R</span>
      <span>O S A</span>
      <span>R E T Í C</span>
      <span>U L A</span>
      <span>R</span>
    </span>
    <span class="footer-wordmark">Rosa Retícula</span>
    <span class="footer-byline meta">
      <span data-i18n="workbench.by"></span>
      <a
        class="author-link"
        href="https://rosa-gus.github.io/portfolio"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="author-accent">rosa</span>-gus
      </a>
    </span>
  </div>
  <nav class="footer-links" aria-label="" data-i18n-aria-label="workbench.resources">
    <a href="https://github.com/rosa-gus/rosa-reticula" target="_blank" rel="noopener noreferrer">
      [<span data-i18n="workbench.repository"></span>
      <span class="icon-arrow" aria-hidden="true">&#x2197;&#xFE0E;</span>]
    </a>
    <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">
      <span class="sr-only" data-i18n="workbench.license"></span>
      [<span data-license></span>
      <span class="icon-arrow" aria-hidden="true">&#x2197;&#xFE0E;</span>]
    </a>
  </nav>
</footer>
<template id="range-control-template">
  <div class="control">
    <div class="control-heading">
      <div class="control-title">
        <label data-control-label></label>
        <span data-control-help></span>
      </div>
      <output></output>
    </div>
    <input type="range">
  </div>
</template>

<template id="help-template">
  <span class="help">
    <button type="button" class="tooltip-trigger" aria-expanded="false">[?]</button>
    <span class="app-tooltip" popover="auto" role="tooltip">
      <span class="tooltip-content">
        <span class="tooltip-title" data-help-title></span>
        <span data-help-explanation></span>
      </span>
    </span>
  </span>
</template>
