<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0a09" />
  <script>
    (() => {
      let theme;
      try {
        theme = localStorage.getItem('rosa-reticula:theme:v1');
      } catch {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ffd6e0' : '#0a0a09';
    })();
  </script>
  <meta name="description" content="Image processing with Bayer-inspired ordered dithering, selective screening, duotone, and PNG export. All processing runs in the browser." />
